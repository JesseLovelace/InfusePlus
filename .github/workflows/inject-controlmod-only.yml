# Injects ONLY InfuseControlMod into an IPA that ALREADY has InfusePlus applied.
# No InfusePlus download, no re-bundling needed.
#
# Put this in .github/workflows/ of your InfusePlus fork, with the
# InfuseControlMod/ folder at the repo root.

name: Add ControlMod to existing IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to your IPA that already has InfusePlus"
        default: ""
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          path: main
          submodules: recursive

      - name: Download IPA (Google Drive aware)
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -e
          pipx install --force "gdown>=5.1.0" >/dev/null 2>&1 || \
            pip3 install --user --break-system-packages -U "gdown>=5.1.0"
          export PATH="$HOME/.local/bin:$PATH"
          OUT="${{ github.workspace }}/input.ipa"
          if echo "$IPA_URL" | grep -qiE 'drive\.google\.com|docs\.google\.com'; then
            # Pull the file id out of any common Drive URL shape and use the
            # version-independent uc?id= form (no --fuzzy needed).
            ID=$(echo "$IPA_URL" | grep -oE '[-_A-Za-z0-9]{25,}' | head -1)
            if [ -z "$ID" ]; then
              echo "::error::Could not find a Google Drive file id in the URL."
              exit 1
            fi
            echo "Detected Google Drive link; file id: $ID"
            gdown "https://drive.google.com/uc?id=$ID" -O "$OUT"
          else
            wget "$IPA_URL" --no-verbose -O "$OUT"
          fi
          ft=$(file --mime-type -b "$OUT")
          echo "Downloaded file type: $ft"
          if [[ "$ft" != "application/zip" && "$ft" != "application/x-ios-app" ]]; then
            echo "::error::Downloaded file is not an IPA (got: $ft). For Google Drive, set the file's sharing to 'Anyone with the link' and paste the normal share URL. First bytes below:"
            head -c 300 "$OUT" || true
            exit 1
          fi

      - name: Install dependencies
        run: brew install make ldid dpkg

      - name: Set PATH for GNU make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      # ---- Build InfuseControlMod with Theos ----
      - name: Checkout Theos
        uses: actions/checkout@v4.1.1
        with:
          repository: theos/theos
          submodules: recursive
          path: theos

      - name: Install iOS SDK
        run: |
          mkdir -p theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -r /tmp/theos-sdks/iPhoneOS16.5.sdk theos/sdks/ || \
          cp -r /tmp/theos-sdks/*.sdk theos/sdks/

      - name: Build control-mod dylib
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          cd main/InfuseControlMod
          make FINALPACKAGE=1
          DY=$(find .theos/obj -maxdepth 1 -name 'InfuseControlMod.dylib' | head -1)
          [ -n "$DY" ] || { echo "::error::Built dylib not found"; exit 1; }
          echo "Built dylib: $DY"
          otool -L "$DY" || true
          cp "$DY" "${{ github.workspace }}/InfuseControlMod.dylib"

      # ---- Surgically add just our dylib (no cyan re-processing) ----
      - name: Inject ControlMod into IPA
        run: |
          python3 -m pip install --user --break-system-packages -U lief
          export PATH="$HOME/.local/bin:$PATH"
          bash main/InfuseControlMod/tools/surgical_inject.sh \
            "${{ github.workspace }}/input.ipa" \
            "${{ github.workspace }}/InfuseControlMod.dylib" \
            "${{ github.workspace }}/Infuse_ControlMod.ipa"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2.0.1
        with:
          name: Infuse +ControlMod (${{ github.run_number }})
          files: Infuse_ControlMod.ipa
          tag_name: controlmod-only-${{ github.run_number }}
          draft: true
